# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions
name: Aurelia CI

on:
    workflow_dispatch:
    push:
        branches: [main]

jobs:
    setup:
        runs-on: ubuntu-latest
        permissions:
            contents: write

        steps:
            - uses: actions/checkout@v7

            - name: Use Node.js
              uses: actions/setup-node@v7
              with:
                  cache: "npm" # Set always-auth in npmrc.
                  cache-dependency-path: "./package-lock.json"

            - run: npm install
            #- run: npm ci
            #- run: npm run build --if-present
            #- run: npm test

            - name: Build Aurelia
              env:
                  VITE_BASE: ${{ vars.VITE_BASE }}
                  VITE_NODE_ENV: ${{ vars.VITE_NODE_ENV }}
                  VITE_SUPABASE_KEY: ${{ vars.VITE_SUPABASE_KEY }} # Highly recommended to move this to SECRETS instead of variables!
                  VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
                  VITE_TITLE: ${{ vars.VITE_TITLE }}
              run: npm run build

            - name: Deploy to branch
              uses: peaceiris/actions-gh-pages@v4
              with:
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  publish_dir: ./dist
